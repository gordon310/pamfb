      "Excel 模板","系统导出文件","API 对接","PMS / 餐饮系统直连","人工录入","其他" ]},
    { id: "q45", num: 45, type: "single", label: "数据是否需要脱敏后上传？", required: true,
      options: ["需要脱敏","可提供原始数据","视字段而定","暂不确定"] },
    { id: "q46", num: 46, type: "single", label: "数据权限与可见范围？", required: true,
      options: ["仅本店可见","集团可见","可参与匿名对标","不参与共享"] },
    { id: "q47", num: 47, type: "single", label: "是否需要签署数据保密协议？", required: true,
      options: ["需要","建议","不需要"] },
  ]},
  { title: "十一、报告与订阅交付", questions: [
    { id: "q48", num: 48, type: "multi", label: "期望的报告形式？", required: true, options: [
      "在线看板（实时）","PDF 报告","Excel 明细","顾问解读会议","微信 / 邮件推送","其他" ]},
    { id: "q49", num: 49, type: "multi", label: "报告频率？", required: true, options: [
      "实时","月度","季度","年度","事件触发（如竞对异动）","按需" ]},
    { id: "q50", num: 50, type: "single", label: "订阅年费的付费方式？", required: true,
      options: ["单店年费","集团打包","按报告付费","暂不确定"] },
    { id: "q51", num: 51, type: "single", label: "是否需要投资回报的顾问解读？", required: true,
      options: ["需要","可选","不需要"] },
  ]},
  { title: "十二、MVP 与优先级", questions: [
    { id: "q52", num: 52, type: "multi", max: 5, label: "请选出第一阶段最重要的 5 项。", required: true, options: [
      "餐饮设施基础数据采集","餐饮经营数据采集（分餐段）","餐饮投资数据录入",
      "投资回报分析（回收期 / ROI / 坪效）","竞对数据对标","社会餐饮对标",
      "餐饮与客房收入占比分析","宴会独立分析","数据上传与脱敏","在线看板（实时）",
      "月度 / 季度 / 年度报告","顾问诊断报告","微信 / 邮件推送" ]},
    { id: "q53", num: 53, type: "multi", max: 3, label: "最希望系统优先解决什么？", required: true, options: [
      "餐饮数据分散、口径不一","不知道自身在全国 / 城市 / 商圈的位置","缺少竞对数据",
      "缺少投资回报测算","宴会经营不透明","平均消费 / 坪效 / 上座率算不清",
      "报告制作耗时","数据安全顾虑","暂时没有明显痛点" ]},
    { id: "q54", num: 54, type: "text", label: "如有特别重要的问题，可补充一句：", required: false, placeholder: "选填" },
  ]},
];

const MAX_HINTS = { q52: "最多选 5 项", q53: "最多选 3 项" };

/* ---------- 渲染 ---------- */
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function buildQuestion(q) {
  const hint = q.max ? '<span class="hint">' + MAX_HINTS[q.id] + "</span>" : "";
  const req = q.required ? '<span class="req">*</span>' : "";
  const title = '<div class="title">' + (q.num ? q.num + ". " : "") + esc(q.label) + req + hint + "</div>";
  const desc = q.desc ? '<div class="desc">' + esc(q.desc) + "</div>" : "";

  if (q.type === "text" || q.type === "date") {
    return '<div class="q" data-qid="' + q.id + '">' + title +
      '<input type="' + q.type + '" id="' + q.id + '" name="' + q.id + '"' +
      (q.type === "text" ? ' placeholder="' + esc(q.placeholder || "") + '"' : "") + " /></div>";
  }

  const inputType = q.type === "multi" ? "checkbox" : "radio";
  const opts = q.options.map((o, i) => {
    const oid = q.id + "_" + i;
    return '<label class="opt" for="' + oid + '">' +
      '<input type="' + inputType + '" id="' + oid + '" name="' + q.id + '" value="' + esc(o) + '" />' +
      "<span>" + esc(o) + "</span></label>";
  }).join("");
  return '<div class="q" data-qid="' + q.id + '">' + title + desc +
    '<div class="opts">' + opts + "</div></div>";
}

function render() {
  const form = document.getElementById("form");
  form.innerHTML = SECTIONS.map(sec =>
    '<section class="card"><h2>' + esc(sec.title) + "</h2>" +
    sec.questions.map(buildQuestion).join("") + "</section>"
  ).join("");

  const d = new Date();
  const today = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const dateEl = document.getElementById("fill_date");
  if (dateEl) dateEl.value = today;

  form.addEventListener("change", onChange);
}

function onChange(e) {
  const el = e.target;
  if (el.type === "checkbox" || el.type === "radio") {
    const wrap = el.closest(".q");
    const qid = wrap.dataset.qid;
    const max = (SECTIONS.flatMap(s => s.questions).find(q => q.id === qid) || {}).max;
    if (el.type === "checkbox" && max) {
      const checked = wrap.querySelectorAll('input[type="checkbox"]:checked');
      if (checked.length > max) {
        el.checked = false;
        setStatus("「" + (MAX_HINTS[qid] || ("最多选 " + max + " 项")) + "」，已取消多出的选择。", "err");
      }
    }
    wrap.querySelectorAll("label.opt").forEach(lbl => {
      const inp = lbl.querySelector("input");
      lbl.classList.toggle("checked", inp.checked);
    });
  }
}

/* ---------- 收集 ---------- */
function collect() {
  const answers = {};
  SECTIONS.flatMap(s => s.questions).forEach(q => {
    if (q.type === "multi") {
      answers[q.id] = Array.from(document.querySelectorAll('input[name="' + q.id + '"]:checked')).map(i => i.value);
    } else if (q.type === "single") {
      const c = document.querySelector('input[name="' + q.id + '"]:checked');
      answers[q.id] = c ? c.value : "";
    } else {
      const el = document.getElementById(q.id);
      answers[q.id] = el ? el.value.trim() : "";
    }
  });
  return answers;
}

function validate(a) {
  const missing = [];
  SECTIONS.flatMap(s => s.questions).forEach(q => {
    if (!q.required) return;
    const v = a[q.id];
    const empty = Array.isArray(v) ? v.length === 0 : !v;
    if (empty) missing.push((q.num ? q.num + ". " : "") + q.label);
  });
  return missing;
}

/* ---------- 输出（精简：只列已选答案，控制 URL 长度） ---------- */
function toMarkdown(a) {
  const lines = [];
  lines.push("- 填写人姓名：" + (a.submitter_name || ""));
  lines.push("- 酒店名称：" + (a.hotel_name || ""));
  lines.push("- 所属部门 / 岗位：" + (a.dept || ""));
  lines.push("- 填写日期：" + (a.fill_date || ""));
  lines.push("");
  SECTIONS.forEach(sec => {
    sec.questions.filter(q => q.id.startsWith("q")).forEach(q => {
      const v = a[q.id];
      if (q.type === "multi") {
        const sel = v || [];
        if (!sel.length) return;
        lines.push(q.num + ". " + sel.join("；"));
      } else {
        if (!v) return;
        lines.push(q.num + ". " + v);
      }
    });
  });
  return lines.join("\n");
}

function issueTitle(a) {
  return "[餐饮需求答卷] " + (a.hotel_name || "未署名酒店") + " / " + (a.submitter_name || "未署名") + " / " + (a.fill_date || "");
}

function issueUrl(a) {
  const title = issueTitle(a);
  const body = toMarkdown(a);
  const base = "https://github.com/" + GITHUB_REPO + "/issues/new";
  const params = "title=" + encodeURIComponent(title) +
    "&body=" + encodeURIComponent(body) +
    "&labels=" + encodeURIComponent(ISSUE_LABEL);
  return base + "?" + params;
}

function setStatus(msg, kind) {
  const el = document.getElementById("status");
  el.textContent = msg;
  el.className = kind || "";
}

/* ---------- 事件 ---------- */
function onSubmit() {
  const a = collect();
  const missing = validate(a);
  if (missing.length) {
    setStatus("还有 " + missing.length + " 项必填未完成，例如：" + missing.slice(0, 3).join("；"), "err");
    const first = document.querySelector('[data-qid="' + (missing[0].match(/^(\d+)\./) ? "q" + RegExp.$1 : "submitter_name") + '"]');
    if (first) first.scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }
  if (RELAY_URL) { submitViaRelay(a); return; }
  const url = issueUrl(a);
  if (url.length <= 7500) {
    setStatus("已在新标签页打开 GitHub 提交页，请检查后点击 Submit new issue。", "ok");
    window.open(url, "_blank", "noopener");
    return;
  }
  const body = toMarkdown(a);
  const done = () => {
    setStatus("答案已复制。请在打开的 GitHub 页面填写标题（含酒店/姓名）并粘贴正文后提交。", "err");
    window.open("https://github.com/" + GITHUB_REPO + "/issues/new", "_blank", "noopener");
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(body).then(done, () => fallbackCopy(body, done));
  } else {
    fallbackCopy(body, done);
  }
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function verifyIssue(number) {
  for (let i = 0; i < 3; i++) {
    try {
      const r = await fetch("https://api.github.com/repos/" + GITHUB_REPO + "/issues/" + number,
        { headers: { Accept: "application/vnd.github+json" } });
      if (r.ok) return true;
      if (r.status !== 404) return false;
    } catch (e) { return false; }
    await sleep(800);
  }
  return false;
}

async function submitViaRelay(a) {
  const btn = document.getElementById("btn-submit");
  btn.disabled = true;
  setStatus("正在提交…", "");
  const headers = { "Content-Type": "application/json" };
  if (FORM_KEY) headers["x-form-key"] = FORM_KEY;
  try {
    const r = await fetch(RELAY_URL, {
      method: "POST",
      headers: headers,
      body: JSON.stringify({ title: issueTitle(a), body: toMarkdown(a) })
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    if (!d || d.ok !== true) throw new Error("服务未确认创建");
    let verified = d.verified;
    if (verified !== true && d.number) verified = await verifyIssue(d.number);
    if (!verified) throw new Error("记录校验未通过，请重试");
    window.location.href = "thanks.html" + (d.number ? ("?no=" + d.number) : "");
  } catch (e) {
    btn.disabled = false;
    setStatus("提交失败：" + e.message + "。请重试，或联系管理员。", "err");
  }
}

function fallbackCopy(text, done) {
  const ta = document.createElement("textarea");
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); done(); }
  catch (e) { setStatus("复制失败，请手动选择文本。", "err"); }
  document.body.removeChild(ta);
}

render();
document.getElementById("btn-submit").addEventListener("click", onSubmit);
document.getElementById("btn-done").addEventListener("click", () => {
  document.getElementById("done").style.display = "none";
  try { window.close(); } catch (e) {}
});
</script>
</body>
